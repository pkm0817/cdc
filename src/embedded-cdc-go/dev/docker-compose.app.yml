# ─────────────────────────────────────────────────────────────────────────────
# cdc-service — go-pq-cdc 로 논리 복제를 직접 읽는 Go 서비스
#
#   source-postgres (WAL) ──logical replication──▶ cdc-service ──pgx──▶ target-postgres
#
# Java 판과 달리 offset 볼륨이 없다. "어디까지 읽었는지"는 원천의 복제 슬롯
# (confirmed_flush_lsn)과 수신 측 cdc_checkpoint 표에 남으므로,
# 컨테이너를 지우고 다시 만들어도 멈춘 지점부터 이어서 읽는다.
# ─────────────────────────────────────────────────────────────────────────────
# 루트 docker-compose.yml 의 include 로만 쓴다 — 단독으로 -f 지정해 올리면 프로젝트가
# 따로 잡혀 같은 container_name/네트워크를 두고 충돌한다.
networks:
  emb-cdc-go-net:
    name: emb-cdc-go-net

services:
  cdc-service:
    # 두 DB 가 healthy 가 된 뒤에 올라온다. 원천이 아직 wal_level=logical 로 다시
    # 뜨기 전에 붙으면 복제 슬롯 생성이 실패한 채로 재시도 루프에 빠진다.
    # (루트 compose 는 include 한 서비스를 덮어쓸 수 없으므로 여기에 둔다)
    depends_on:
      source-postgres:
        condition: service_healthy
      target-postgres:
        condition: service_healthy
    build:
      context: ./cdc-service
    image: embedded-cdc-go/cdc-service:local
    container_name: emb-cdc-go-service
    networks: [emb-cdc-go-net]
    environment:
      SOURCE_DB_HOST: source-postgres
      SOURCE_DB_PORT: "5432"
      TARGET_DB_HOST: target-postgres
      TARGET_DB_PORT: "5432"
      # 되받을 수 없는 WAL 구간을 발견해도 기동을 계속할지. 기본은 거부(true)다.
      #
      # 갭이 확인된 뒤 "그 구간은 포기하고 나머지 backlog 라도 따라잡겠다" 고
      # 사람이 판단했을 때만 false 로 한 번 띄운다 — 복구 전용 스위치다:
      #   CDC_FAIL_ON_CAPTURE_GAP=false podman compose up -d cdc-service
      # 따라잡은 뒤에는 반드시 기본값으로 되돌려 가드를 다시 무장시킬 것.
      CDC_FAIL_ON_CAPTURE_GAP: ${CDC_FAIL_ON_CAPTURE_GAP:-true}
    ports:
      - "57080:8080"
    healthcheck:
      # /status 는 go-pq-cdc 가 띄우는 서버의 헬스 엔드포인트다.
      # 같은 포트의 /metrics 로 지표도 나간다.
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
