# ─────────────────────────────────────────────────────────────────────────────
# 모니터링 스택 — Prometheus + Grafana + postgres_exporter × 2 + cAdvisor + node-exporter
#
#   source-exporter : source DB 의 테이블별 행 수 + slot 지연 + WAL 용량 + DB 크기
#   target-exporter : target DB 의 테이블별 행 수 + 소프트 삭제 행 수 + WAL 용량 + DB 크기
#   cadvisor        : 컨테이너별 CPU·메모리·파일시스템 사용량 (앱 + source/target DB)
#   node-exporter   : 도커 VM 의 디스크 여유 — WAL 이 슬롯에 붙잡혀 쌓일 때 고갈 경보용
#   prometheus      : 위 수집기들 + cdc-service(/metrics) 수집
#   grafana         : 정합성·처리량·지연 + 연산별(INSERT·UPDATE·DELETE) + 리소스 대시보드
#
# Java 판(embedded-cdc)과 같은 구성·같은 지표 이름을 쓴다. 두 스택을 나란히 띄워
# 대시보드를 나란히 놓고 비교하기 위해서다. 포트와 이름만 다르다.
#
# 접속: Grafana http://localhost:57300 (admin/admin, 익명 Viewer 허용)
#       Prometheus http://localhost:57090
# ─────────────────────────────────────────────────────────────────────────────
name: embedded-cdc-go-monitoring

networks:
  emb-cdc-go-net:
    external: true

services:
  source-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: emb-cdc-go-source-exporter
    networks: [emb-cdc-go-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@source-postgres:5432/sourcedb?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pgexporter/queries-source.yaml
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    volumes:
      - ./exporter:/etc/pgexporter:ro
    ports:
      - "57187:9187"

  target-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: emb-cdc-go-target-exporter
    networks: [emb-cdc-go-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@target-postgres:5432/targetdb?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pgexporter/queries-target.yaml
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    volumes:
      - ./exporter:/etc/pgexporter:ro
    ports:
      - "57188:9187"

  # ── 리소스 계측 ────────────────────────────────────────────────────────────
  # cAdvisor 는 도커 데몬 전체를 보므로 두 스택(Java/Go)의 컨테이너가 모두 잡힌다.
  # 대시보드 쿼리에서 name=~"emb-cdc-go-(service|source-pg|target-pg)" 로 걸러 쓴다.
  # (PromQL 의 =~ 는 완전 일치라 emb-cdc-go-* 는 여기에 걸리지 않는다)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: emb-cdc-go-cadvisor
    networks: [emb-cdc-go-net]
    privileged: true
    command:
      # 필요한 것만 켠다. 기본값은 수집 항목이 많아 스크랩이 무거워진다.
      - --housekeeping_interval=5s
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "57191:8080"

  # 도커 VM 의 파일시스템 여유. WAL 은 replication slot 이 붙잡고 있으면 계속 자라고,
  # 다 차면 source DB 가 먼저 죽는다. 그래서 행 수보다 이 그래프가 먼저 경보를 준다.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: emb-cdc-go-node-exporter
    networks: [emb-cdc-go-net]
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.meminfo
      - --collector.cpu
    volumes:
      - /:/host:ro
    ports:
      - "57192:9100"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: emb-cdc-go-prometheus
    networks: [emb-cdc-go-net]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - emb-go-prometheus-data:/prometheus
    ports:
      - "57090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: emb-cdc-go-grafana
    networks: [emb-cdc-go-net]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - emb-go-grafana-data:/var/lib/grafana
    ports:
      - "57300:3000"

volumes:
  emb-go-prometheus-data:
  emb-go-grafana-data:
