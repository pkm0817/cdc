# ─────────────────────────────────────────────────────────────────────────────
# 모니터링 스택 — Prometheus + Grafana + postgres_exporter × 2
#
#   source-exporter : source DB 의 테이블별 행 수 + replication slot 지연
#   target-exporter : target DB 의 테이블별 행 수 + 소프트 삭제 행 수
#   prometheus      : 위 exporter 2개 + cdc-service(/metrics) 수집
#   grafana         : 정합성(행 수 비교)·처리량·지연 대시보드 자동 프로비저닝
#
# Java 판(embedded-cdc)과 같은 구성·같은 지표 이름을 쓴다. 두 스택을 나란히 띄워
# 대시보드를 나란히 놓고 비교하기 위해서다. 포트와 이름만 다르다.
#
# 접속: Grafana http://localhost:57300 (admin/admin, 익명 Viewer 허용)
#       Prometheus http://localhost:57090
# ─────────────────────────────────────────────────────────────────────────────
name: embedded-cdc-go-monitoring

networks:
  emb-cdc-go-net:
    external: true

services:
  source-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: emb-cdc-go-source-exporter
    networks: [emb-cdc-go-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@source-postgres:5432/sourcedb?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pgexporter/queries-source.yaml
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    volumes:
      - ./exporter:/etc/pgexporter:ro
    ports:
      - "57187:9187"

  target-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: emb-cdc-go-target-exporter
    networks: [emb-cdc-go-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@target-postgres:5432/targetdb?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pgexporter/queries-target.yaml
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    volumes:
      - ./exporter:/etc/pgexporter:ro
    ports:
      - "57188:9187"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: emb-cdc-go-prometheus
    networks: [emb-cdc-go-net]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - emb-go-prometheus-data:/prometheus
    ports:
      - "57090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: emb-cdc-go-grafana
    networks: [emb-cdc-go-net]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - emb-go-grafana-data:/var/lib/grafana
    ports:
      - "57300:3000"

volumes:
  emb-go-prometheus-data:
  emb-go-grafana-data:
