# ─────────────────────────────────────────────────────────────────────────────
# Target PostgreSQL — CDC 적재 대상 DB
#
# 특별한 복제 설정이 필요 없다. cdc-service 가 일반 JDBC 로 UPSERT/DELETE 할 뿐이다.
# ─────────────────────────────────────────────────────────────────────────────
# 루트 docker-compose.yml 의 include 로만 쓴다 — 단독으로 -f 지정해 올리면 프로젝트가
# 따로 잡혀 같은 container_name/네트워크를 두고 충돌한다.
networks:
  emb-cdc-net:
    name: emb-cdc-net

services:
  target-postgres:
    image: postgres:16
    container_name: emb-cdc-target-pg
    networks: [emb-cdc-net]
    environment:
      POSTGRES_DB: targetdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "56433:5432"
    volumes:
      - emb-target-pgdata:/var/lib/postgresql/data
      - ./target/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d targetdb"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  emb-target-pgdata:
