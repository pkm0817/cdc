global:
  scrape_interval: 5s
  evaluation_interval: 5s

# 경보 규칙. 임계값의 근거는 규칙 파일 상단 주석 참고 (검증 V1~V6 결과에서 온 값들이다).
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # cdc-service (Spring Boot / Micrometer) — 처리량, end-to-end 지연, 에러
  - job_name: cdc-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cdc-service:8080"]

  # source DB — 테이블별 행 수 + replication slot 지연
  - job_name: source-db
    static_configs:
      - targets: ["source-exporter:9187"]

  # target DB — 테이블별 행 수 + 소프트 삭제 행 수
  - job_name: target-db
    static_configs:
      - targets: ["target-exporter:9187"]

  # 컨테이너 리소스 — rootless podman 에서는 cAdvisor 가 컨테이너를 이름으로 잡지
  # 못하므로 podman 소켓을 직접 읽는 수집기를 쓴다. 데몬 전체를 보므로 Java/Go
  # 두 스택이 다 들어온다. 여기서 거르지 않고 대시보드 쿼리에서 이름으로 거른다.
  # 대시보드는 rules/container-resources.yml 이 만드는 cdc:container_* 만 읽는다.
  - job_name: podman
    static_configs:
      - targets: ["podman-exporter:9882"]

  # docker 데몬 환경이면 위 job 대신 아래를 살리고 --profile cadvisor 로 띄운다.
  # (켜 둔 채로 두면 Targets 에 DOWN 이 하나 상주한다)
  # - job_name: cadvisor
  #   static_configs:
  #     - targets: ["cadvisor:8080"]

  # 도커 VM 디스크·메모리 — WAL 고갈 감시
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
