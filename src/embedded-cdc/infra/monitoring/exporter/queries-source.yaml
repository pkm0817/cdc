# source DB 전용 커스텀 쿼리
# 메트릭 이름 = <최상위 키>_<컬럼명>  (예: cdc_source_rows{table_name="car"})
#
# ── 테이블 목록을 적지 않는다 ────────────────────────────────────────────────
# 예전에는 UNION ALL 로 car, computer 를 열거했다. 그러면 테이블이 늘 때마다
# 이 파일을 같이 고쳐야 하고, 잊으면 대시보드에서 조용히 빠진다(실제로 그랬다).
#
# 대신 pg_publication_tables 에서 읽는다. "무엇을 캡처하는가"의 정의는
# publication 그 자체이므로, 여기 있는 것이 곧 감시 대상이다.
# ALTER PUBLICATION ... ADD TABLE 하면 다음 스크랩부터 메트릭이 저절로 생긴다.
#
# count(*) 를 쓰는 이유: 대시보드가 source 와 target 의 행 수 차이로 정합성을
# 판정한다. pg_stat_user_tables.n_live_tup 은 ANALYZE 시점에 따라 흔들리는
# 추정치라 이 판정에 쓸 수 없다. 정확도를 위해 스캔 비용을 감수한다.
#
# query_to_xml 은 "테이블 이름을 런타임에 받아 count 하는" 유일한 순수 SQL 수단이다.
# (SQL 은 식별자를 변수로 못 받으므로 동적 SQL 이 필요한데, 함수를 새로 만들지 않고
#  쓸 수 있는 것이 이 내장 함수다)
# ───────────────────────────────────────────────────────────────────────────
cdc_source:
  query: |
    SELECT t.tablename AS table_name,
           (xpath('/row/c/text()',
                  query_to_xml(format('SELECT count(*) AS c FROM %I.%I', t.schemaname, t.tablename),
                               false, true, '')))[1]::text::float AS rows
    FROM pg_publication_tables t
    WHERE t.pubname = 'embedded_cdc_pub'
      -- 파이프라인 자신의 살림살이는 대사 대상이 아니다.
      -- cdc_heartbeat 는 publication 에는 들어가지만 target 에는 없다 —
      -- 거르지 않으면 source/target 행 수 판정이 영구 불일치가 된다.
      AND t.tablename NOT LIKE 'cdc\_%'
  metrics:
    - table_name:
        usage: "LABEL"
        description: "table name (discovered from the publication)"
    - rows:
        usage: "GAUGE"
        description: "exact row count in source table"

# replication slot 지연 — cdc-service 가 멈추면 lag_bytes 가 계속 자란다 (디스크 고갈 경보용)
# 슬롯 역시 이름을 적지 않는다. 새 슬롯이 생기면 그대로 잡힌다.
cdc_slot:
  query: |
    SELECT slot_name,
           active::int AS active,
           COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn), 0)::float AS lag_bytes,
           COALESCE(pg_wal_lsn_diff(restart_lsn, '0/0'::pg_lsn), 0)::float           AS restart_lsn_bytes,
           COALESCE(pg_wal_lsn_diff(confirmed_flush_lsn, '0/0'::pg_lsn), 0)::float   AS confirmed_lsn_bytes,
           COALESCE(safe_wal_size, -1)::float                                        AS safe_wal_size_bytes
    FROM pg_replication_slots
  metrics:
    - slot_name:
        usage: "LABEL"
        description: "replication slot name"
    - active:
        usage: "GAUGE"
        description: "1 if a consumer is currently connected to the slot"
    - lag_bytes:
        usage: "GAUGE"
        description: "WAL bytes retained but not yet confirmed by the consumer"
    - restart_lsn_bytes:
        usage: "GAUGE"
        description: "restart_lsn as a byte offset — the oldest WAL the slot still needs (V3 capture-gap 판정용)"
    - confirmed_lsn_bytes:
        usage: "GAUGE"
        description: "confirmed_flush_lsn as a byte offset — 유휴 구간에서 이 값이 안 오르면 heartbeat 미동작 (V6)"
    - safe_wal_size_bytes:
        usage: "GAUGE"
        description: "슬롯이 무효화되기까지 남은 WAL 여유. -1 = max_slot_wal_keep_size 가 -1(상한 없음)이라 산출 불가"

# ── WAL 디렉터리 사용량 ──────────────────────────────────────────────────────
# 슬롯이 붙잡은 WAL 은 pg_wal/ 안에 파일로 남아 디스크를 먹는다. cdc_slot_lag_bytes 가
# "얼마나 밀렸나"라면 이쪽은 "그래서 디스크를 얼마나 쓰고 있나"다. 컨슈머가 죽어 있으면
# 두 값이 같이 오르고, 살아나면 lag 이 먼저 떨어지고 WAL 은 체크포인트 뒤에 준다.
# pg_ls_waldir() 는 superuser 또는 pg_monitor 권한이 필요하다(여기 접속 계정은 postgres).
cdc_wal:
  query: |
    SELECT COALESCE(sum(size), 0)::float AS size_bytes,
           count(*)::float               AS files
    FROM pg_ls_waldir()
  metrics:
    - size_bytes:
        usage: "GAUGE"
        description: "total bytes held in pg_wal/"
    - files:
        usage: "GAUGE"
        description: "number of WAL segment files"

# ── DB 용량 · 접속 수 ────────────────────────────────────────────────────────
# 행 수가 같아도 디스크 사용량은 다를 수 있다(target 은 소프트 삭제 행을 계속 들고 간다).
cdc_db:
  query: |
    SELECT pg_database_size(current_database())::float AS size_bytes,
           (SELECT count(*) FROM pg_stat_activity WHERE datname = current_database())::float AS connections
  metrics:
    - size_bytes:
        usage: "GAUGE"
        description: "database size on disk"
    - connections:
        usage: "GAUGE"
        description: "current backend connections to this database"

# ── 슬롯 건전성 상태 (V3) ───────────────────────────────────────────────────
# lag_bytes 는 "얼마나 밀렸나"만 말한다. 슬롯이 살아 있으면서 쓸모없어지는 상태
# (max_slot_wal_keep_size 초과로 필요한 WAL 이 잘림)는 wal_status 로만 보인다.
# 실무에서는 슬롯이 삭제되는 것보다 이쪽이 훨씬 잦다.
#
#   reserved(0)   : 정상
#   extended(1)   : wal_keep_size 를 넘겼지만 아직 보관 중
#   unreserved(2) : 곧 잘린다 — 경고
#   lost(3)       : 이미 잘렸다 — V3 상황 확정, 재동기화 외에 방법 없음
#
# wal_status 를 별도 네임스페이스로 뺀 이유: 같은 쿼리의 LABEL 은 그 쿼리의 모든
# 메트릭에 붙는다. cdc_slot 에 넣으면 lag_bytes 계열에 status 라벨이 붙어
# 상태가 바뀔 때마다 시계열이 끊긴다.
cdc_slot_status:
  query: |
    SELECT slot_name,
           wal_status,
           (CASE wal_status
              WHEN 'reserved'   THEN 0
              WHEN 'extended'   THEN 1
              WHEN 'unreserved' THEN 2
              WHEN 'lost'       THEN 3
              ELSE -1
            END)::float AS code
    FROM pg_replication_slots
  metrics:
    - slot_name:
        usage: "LABEL"
        description: "replication slot name"
    - wal_status:
        usage: "LABEL"
        description: "reserved / extended / unreserved / lost"
    - code:
        usage: "GAUGE"
        description: "wal_status 를 정렬 가능한 숫자로. 경보는 이 값으로 건다 (>=2 경고, ==3 즉시)"

# ── WAL 생성량 카운터 (V2) ──────────────────────────────────────────────────
# cdc_wal_size_bytes 는 pg_wal/ 의 현재 크기라 체크포인트마다 오르내린다.
# "얼마나 빨리 쌓이는가"를 재려면 단조 증가하는 값이 필요하다.
# 현재 LSN 을 0/0 기준 바이트 오프셋으로 노출하고 rate() 로 증가율을 뽑는다.
#
# 이 값이 있어야 V2 의 "다운 허용시간 = 디스크 여유 / WAL 증가율" 이 산출된다.
# REPLICA IDENTITY DEFAULT vs FULL 의 WAL 비용 비교도 이 지표로 한다.
cdc_wal_lsn:
  query: |
    SELECT pg_wal_lsn_diff(pg_current_wal_lsn(), '0/0'::pg_lsn)::float AS bytes_total
  metrics:
    - bytes_total:
        usage: "COUNTER"
        description: "current WAL LSN as a byte offset — rate() 로 WAL 증가율(B/s)을 낸다"

# ── DB 시계 (V1) ────────────────────────────────────────────────────────────
# cdc_end_to_end_lag_seconds 는 source 의 ts_ms(DB 시계)와 target 적재 시각(앱 시계)의
# 차이다. 두 시계가 어긋나 있으면 지연 수치 자체가 무의미해진다(1차 실행에서 3,561ms
# 편차가 났고 재려던 지연은 526ms 였다).
#
# 스크랩 시점의 DB 시계를 그대로 노출한다. Prometheus 쪽에서
#   cdc_clock_epoch_seconds - timestamp(cdc_clock_epoch_seconds)
# 로 "DB 시계 − 스크랩 시각" 을 얻고, 앱도 같은 방식으로 계산해 차를 낸다.
# timestamp() 를 쓰는 이유: time() 을 쓰면 스크랩 간격(5s)이 편차로 잡힌다.
cdc_clock:
  query: |
    SELECT extract(epoch from clock_timestamp())::float AS epoch_seconds
  metrics:
    - epoch_seconds:
        usage: "GAUGE"
        description: "DB wall clock at scrape time (unix epoch seconds)"

# ── 운영 파라미터 현재값 (V2 · 완료조건) ────────────────────────────────────
# 보고서의 "운영 전환시 권고 설정값" 항목을 현재값과 나란히 놓기 위한 지표.
# max_slot_wal_keep_size 가 -1 인 한 V2 의 다운 허용시간은 "디스크 찰 때까지" 다.
# 숫자로 변환 가능한 것만 넣는다 (wal_level 같은 enum 은 cast 가 실패한다).
cdc_guc:
  query: |
    SELECT name,
           COALESCE(unit, '') AS unit,
           setting::float     AS value
    FROM pg_settings
    WHERE name IN ('max_slot_wal_keep_size', 'wal_keep_size', 'max_wal_size',
                   'min_wal_size', 'checkpoint_timeout', 'max_replication_slots',
                   'max_wal_senders')
  metrics:
    - name:
        usage: "LABEL"
        description: "GUC name"
    - unit:
        usage: "LABEL"
        description: "unit as reported by pg_settings (MB, s, ...)"
    - value:
        usage: "GAUGE"
        description: "current setting. max_slot_wal_keep_size = -1 이면 상한 없음"

# ── REPLICA IDENTITY 현황 (V5 · V2) ─────────────────────────────────────────
# V5 는 FULL 을 요구하고(그래야 TOAST 미변경 컬럼의 before/after 가 온전히 온다),
# V2 는 FULL 때문에 WAL 이 커진다(update/delete 마다 변경 전 행 전체를 쓴다).
# 두 요구가 충돌하므로 테이블별 현재 설정을 보이는 곳에 둔다.
cdc_replica_identity:
  query: |
    SELECT c.relname AS table_name,
           (CASE c.relreplident
              WHEN 'd' THEN 'default'
              WHEN 'n' THEN 'nothing'
              WHEN 'f' THEN 'full'
              WHEN 'i' THEN 'index'
              ELSE 'unknown'
            END) AS identity,
           (CASE WHEN c.relreplident = 'f' THEN 1 ELSE 0 END)::float AS full_image
    FROM pg_class c
    JOIN pg_namespace n ON n.oid = c.relnamespace
    WHERE n.nspname = 'public' AND c.relkind = 'r'
  metrics:
    - table_name:
        usage: "LABEL"
        description: "table name"
    - identity:
        usage: "LABEL"
        description: "default / nothing / full / index"
    - full_image:
        usage: "GAUGE"
        description: "1 if REPLICA IDENTITY FULL (before 이미지가 전체 컬럼)"

# ── TOAST 저장소 (V5) ───────────────────────────────────────────────────────
# TOAST 임계는 대략 2KB(블록의 1/4). 그보다 큰 값이 실제로 들어간 테이블만
# V5 의 __debezium_unavailable_value 문제에 걸린다.
#
# has_toast 는 판별에 못 쓴다 — varlena 컬럼이 하나라도 있으면 PostgreSQL 이
# TOAST 릴레이션을 미리 만들어 두므로 거의 모든 테이블이 1 이다.
# 실제 신호는 bytes 다. 비어 있으면 8KB 안팎이고, 그보다 크면 외부 저장이 일어났다는 뜻.
cdc_toast:
  query: |
    SELECT c.relname AS table_name,
           (CASE WHEN c.reltoastrelid <> 0 THEN 1 ELSE 0 END)::float          AS has_toast,
           COALESCE(pg_total_relation_size(NULLIF(c.reltoastrelid, 0)), 0)::float AS bytes
    FROM pg_class c
    JOIN pg_namespace n ON n.oid = c.relnamespace
    WHERE n.nspname = 'public' AND c.relkind = 'r'
  metrics:
    - table_name:
        usage: "LABEL"
        description: "table name"
    - has_toast:
        usage: "GAUGE"
        description: "1 if the table has a TOAST relation (varlena 컬럼이 있으면 대부분 1 — 판별용 아님)"
    - bytes:
        usage: "GAUGE"
        description: "TOAST 저장소 실제 크기. 8KB 를 크게 넘으면 외부 저장이 일어난 것"

# ── 컬럼 폭 (V5) ────────────────────────────────────────────────────────────
# "관심 필드가 TOAST 에 걸리는가"를 스캔 없이 가늠하는 지표.
# pg_stats.avg_width 는 ANALYZE 가 남긴 통계라 비용이 0 이다. 대신 평균이므로
# 후보를 좁히는 용도이고, 확정은 아래 쿼리를 한 번 돌려서 한다:
#
#   SELECT max(pg_column_size(<컬럼>)) FROM <테이블>;
#
# 이 정확한 쿼리를 스크랩마다 돌리지 않는 이유는 컬럼마다 전체 스캔이 필요해서다.
# ANALYZE 를 한 번도 안 돈 테이블은 여기 안 나온다(통계가 없다).
cdc_column:
  query: |
    SELECT s.tablename AS table_name,
           s.attname   AS column_name,
           s.avg_width::float AS avg_width_bytes
    FROM pg_stats s
    JOIN pg_class c     ON c.relname = s.tablename
    JOIN pg_namespace n ON n.oid = c.relnamespace AND n.nspname = s.schemaname
    WHERE s.schemaname = 'public' AND c.relkind = 'r'
  metrics:
    - table_name:
        usage: "LABEL"
        description: "table name"
    - column_name:
        usage: "LABEL"
        description: "column name"
    - avg_width_bytes:
        usage: "GAUGE"
        description: "ANALYZE 기준 평균 저장 폭. 2KB 근처면 TOAST 후보"

# heartbeat 신선도 — "프로세스는 살아 있는데 실제로는 아무것도 안 하는" 상태의 판별식
#
# heartbeat.action.query 는 커넥터 자신의 커넥션으로 이 표에 쓴다. 따라서 age 가
# 자라는 것은 곧 "커넥터가 원천에 붙어 있지 않다" 는 뜻이다 — up==1 이어도 그렇다.
# 이벤트 처리량은 원천에 변경이 없으면 0 이 정상이라 이 판별에 쓸 수 없다.
# 그래서 silent failure 탐지는 이 지표가 맡는다.
#
# 권한이 없어 쿼리가 실패해도 증상이 같다(age 가 자란다) — 그 경우도 여기서 잡힌다.
cdc_heartbeat:
  query: |
    SELECT pipeline,
           EXTRACT(EPOCH FROM (now() - beat_at))::float AS age_seconds
    FROM cdc_heartbeat
  metrics:
    - pipeline:
        usage: "LABEL"
        description: "pipeline name that wrote the beat"
    - age_seconds:
        usage: "GAUGE"
        description: "seconds since the connector last wrote a heartbeat (silent-failure detector)"
