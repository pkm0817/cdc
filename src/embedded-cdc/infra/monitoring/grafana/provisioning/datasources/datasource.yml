apiVersion: 1

datasources:
  - name: Prometheus
    uid: emb-cdc-prom
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s

  # 수신 측 DB 직결.
  #
  # 왜 필요한가. 변경 필드명은 Prometheus 레이블로 올릴 수 없다 —
  # 시계열이 (테이블 x 컬럼 조합) 수만큼 생겨 터진다. 그래서 지표로는 건수만
  # 내고 내용은 cdc_change_audit 표에 남긴다. 그 표를 화면에서 보려면
  # Grafana 가 DB 를 직접 읽어야 한다. 카디널리티 문제는 SQL 에는 없다.
  #
  # 대사(source vs target)나 DLQ 원문 조회에도 같은 데이터소스를 쓴다.
  - name: Target PostgreSQL
    uid: emb-cdc-target-db
    type: postgres
    access: proxy
    url: target-postgres:5432
    database: targetdb
    user: postgres
    editable: false
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      # 대시보드 편집 권한이 있으면 임의 SQL 을 돌릴 수 있다. PoC 라 postgres 로
      # 붙였지만, 운영에서는 cdc_change_audit 에 SELECT 만 가진 계정을 따로 판다.
      timescaledb: false
