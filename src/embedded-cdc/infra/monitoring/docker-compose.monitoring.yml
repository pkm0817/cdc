# ─────────────────────────────────────────────────────────────────────────────
# 모니터링 스택 — Prometheus + Grafana + postgres_exporter × 2
#
#   source-exporter : source DB 의 테이블별 행 수 + replication slot 지연
#   target-exporter : target DB 의 테이블별 행 수 + 소프트 삭제 행 수
#   podman-exporter : 컨테이너별 CPU·메모리·블록 IO (앱 + source/target DB)
#                     — docker 데몬 환경에서는 --profile cadvisor 로 cAdvisor 를 대신 쓴다
#   node-exporter   : 도커 VM 의 디스크 여유 — WAL 이 슬롯에 붙잡혀 쌓일 때 고갈 경보용
#   prometheus      : 위 수집기들 + cdc-service(/actuator/prometheus) 수집
#   grafana         : 정합성·처리량·지연 + 리소스(WAL·디스크·메모리) 대시보드 자동 프로비저닝
#
# 접속: Grafana http://localhost:56300 (admin/admin, 익명 Viewer 허용)
#       Prometheus http://localhost:56090
# ─────────────────────────────────────────────────────────────────────────────
# 루트 docker-compose.yml 의 include 로만 쓴다 — 단독으로 -f 지정해 올리면 프로젝트가
# 따로 잡혀 같은 container_name/네트워크를 두고 충돌한다.
networks:
  emb-cdc-net:
    name: emb-cdc-net

services:
  source-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: emb-cdc-source-exporter
    networks: [emb-cdc-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@source-postgres:5432/sourcedb?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pgexporter/queries-source.yaml
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    volumes:
      - ./exporter:/etc/pgexporter:ro
    ports:
      - "56187:9187"

  target-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: emb-cdc-target-exporter
    networks: [emb-cdc-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@target-postgres:5432/targetdb?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pgexporter/queries-target.yaml
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    volumes:
      - ./exporter:/etc/pgexporter:ro
    ports:
      - "56188:9187"

  # ── 리소스 계측 ────────────────────────────────────────────────────────────
  # 컨테이너별 CPU·메모리·블록 IO. 엔진에 따라 수집기가 다르다.
  #
  # podman(기본) : podman 소켓을 그대로 읽는다. rootless podman 에서는 cAdvisor 를
  #                쓸 수 없다 — /var/lib/docker 도 docker.sock 도 없고, cgroup 이
  #                user.slice 아래로 들어가 컨테이너 이름표가 붙지 않는다.
  # docker       : --profile cadvisor 로 아래 cadvisor 를 대신 띄운다.
  #
  # 어느 쪽이든 데몬 전체를 보므로 두 스택(Java/Go)의 컨테이너가 모두 잡힌다.
  # 대시보드는 prometheus/rules.yml 이 만드는 cdc:container_* 를
  # name=~"emb-cdc-(service|source-pg|target-pg)" 로 걸러 쓴다.
  # (PromQL 의 =~ 는 완전 일치라 emb-cdc-go-* 는 여기에 걸리지 않는다)
  podman-exporter:
    image: quay.io/navidys/prometheus-podman-exporter:v1.21.2
    container_name: emb-cdc-podman-exporter
    networks: [emb-cdc-net]
    # 소켓을 읽으려면 컨테이너 안에서 root 여야 한다(rootless 라도 VM 안 uid 0).
    user: root
    security_opt: ["label=disable"]
    environment:
      CONTAINER_HOST: unix:///run/podman/podman.sock
    command:
      # info 계열 라벨(name/image/pod)을 모든 지표에 붙여 준다 — name 으로 걸러야 하므로 필수.
      - --collector.enhance-metrics
    volumes:
      # rootless podman 의 소켓 위치. uid 가 1000 이 아니면 PODMAN_SOCK 로 덮어쓴다.
      - ${PODMAN_SOCK:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock:ro
    ports:
      - "56193:9882"

  # 도커 데몬이 있을 때만. 기본으로는 뜨지 않는다 (--profile cadvisor).
  cadvisor:
    profiles: [cadvisor]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: emb-cdc-cadvisor
    networks: [emb-cdc-net]
    privileged: true
    command:
      # 필요한 것만 켠다. 기본값은 수집 항목이 많아 스크랩이 무거워진다.
      - --housekeeping_interval=5s
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "56191:8080"

  # 도커 VM 의 파일시스템 여유. WAL 은 replication slot 이 붙잡고 있으면 계속 자라고,
  # 다 차면 source DB 가 먼저 죽는다. 그래서 행 수보다 이 그래프가 먼저 경보를 준다.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: emb-cdc-node-exporter
    networks: [emb-cdc-net]
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.meminfo
      - --collector.cpu
    volumes:
      - /:/host:ro
    ports:
      - "56192:9100"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: emb-cdc-prometheus
    networks: [emb-cdc-net]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - emb-prometheus-data:/prometheus
    ports:
      - "56090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: emb-cdc-grafana
    networks: [emb-cdc-net]
    depends_on: [prometheus, renderer]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # 패널을 PNG 로 굽는 별도 컨테이너. 이게 없으면 /render 가 "No image renderer
      # available" 그림만 돌려주고, 경보 스크린샷과 PDF 내보내기도 동작하지 않는다.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      # 렌더러가 그림을 뜨려고 Grafana 를 다시 부를 때 쓰는 주소다.
      # localhost 로 두면 렌더러 컨테이너 자신을 가리켜 빈 화면이 나온다 —
      # 반드시 compose 네트워크에서 통하는 서비스명이어야 한다.
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - emb-grafana-data:/var/lib/grafana
    ports:
      - "56300:3000"

  # ── 이미지 렌더러 ───────────────────────────────────────────────────────────
  # Grafana 본체에는 렌더링 기능이 없다. 이 컨테이너가 헤드리스 Chromium 을 들고
  # 패널을 그려 PNG 로 돌려준다. 쓰는 곳은 셋이다.
  #   - 대시보드/패널 PNG 내보내기 (공유·보고서 첨부용)
  #   - PDF 내보내기
  #   - 경보 알림에 붙는 스크린샷
  #
  # 포트를 밖으로 열지 않는다. Grafana 만 부르면 되고, 열어두면 임의의 URL 을
  # 렌더링해 달라고 시킬 수 있는 창구가 된다.
  renderer:
    image: grafana/grafana-image-renderer:3.11.6
    container_name: emb-cdc-renderer
    networks: [emb-cdc-net]
    environment:
      # 렌더러 자신의 로그 수준. 그림이 비어 나올 때 원인은 대개 콜백 주소다.
      RENDERING_VERBOSE_LOGGING: "false"
      # 동시 렌더링 수. 기본 5 인데 PoC 스택은 한 사람이 쓰므로 낮춰 메모리를 아낀다.
      RENDERING_CLUSTERING_MAX_CONCURRENCY: "2"
      # 그림에 찍히는 시각의 기준. 안 맞추면 PNG 의 x축만 UTC 로 나와
      # 화면에서 본 것과 다른 구간처럼 읽힌다.
      RENDERING_TIMEZONE: "Asia/Seoul"
    restart: unless-stopped

volumes:
  emb-prometheus-data:
  emb-grafana-data:
