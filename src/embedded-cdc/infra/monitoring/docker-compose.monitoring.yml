# ─────────────────────────────────────────────────────────────────────────────
# 모니터링 스택 — Prometheus + Grafana + postgres_exporter × 2
#
#   source-exporter : source DB 의 테이블별 행 수 + replication slot 지연
#   target-exporter : target DB 의 테이블별 행 수 + 소프트 삭제 행 수
#   cadvisor        : 컨테이너별 CPU·메모리·파일시스템 사용량 (앱 + source/target DB)
#   node-exporter   : 도커 VM 의 디스크 여유 — WAL 이 슬롯에 붙잡혀 쌓일 때 고갈 경보용
#   prometheus      : 위 수집기들 + cdc-service(/actuator/prometheus) 수집
#   grafana         : 정합성·처리량·지연 + 리소스(WAL·디스크·메모리) 대시보드 자동 프로비저닝
#
# 접속: Grafana http://localhost:56300 (admin/admin, 익명 Viewer 허용)
#       Prometheus http://localhost:56090
# ─────────────────────────────────────────────────────────────────────────────
# 루트 docker-compose.yml 의 include 로만 쓴다 — 단독으로 -f 지정해 올리면 프로젝트가
# 따로 잡혀 같은 container_name/네트워크를 두고 충돌한다.
networks:
  emb-cdc-net:
    name: emb-cdc-net

services:
  source-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: emb-cdc-source-exporter
    networks: [emb-cdc-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@source-postgres:5432/sourcedb?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pgexporter/queries-source.yaml
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    volumes:
      - ./exporter:/etc/pgexporter:ro
    ports:
      - "56187:9187"

  target-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: emb-cdc-target-exporter
    networks: [emb-cdc-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@target-postgres:5432/targetdb?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pgexporter/queries-target.yaml
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    volumes:
      - ./exporter:/etc/pgexporter:ro
    ports:
      - "56188:9187"

  # ── 리소스 계측 ────────────────────────────────────────────────────────────
  # cAdvisor 는 도커 데몬 전체를 보므로 두 스택(Java/Go)의 컨테이너가 모두 잡힌다.
  # 대시보드 쿼리에서 name=~"emb-cdc-(service|source-pg|target-pg)" 로 걸러 쓴다.
  # (PromQL 의 =~ 는 완전 일치라 emb-cdc-go-* 는 여기에 걸리지 않는다)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: emb-cdc-cadvisor
    networks: [emb-cdc-net]
    privileged: true
    command:
      # 필요한 것만 켠다. 기본값은 수집 항목이 많아 스크랩이 무거워진다.
      - --housekeeping_interval=5s
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "56191:8080"

  # 도커 VM 의 파일시스템 여유. WAL 은 replication slot 이 붙잡고 있으면 계속 자라고,
  # 다 차면 source DB 가 먼저 죽는다. 그래서 행 수보다 이 그래프가 먼저 경보를 준다.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: emb-cdc-node-exporter
    networks: [emb-cdc-net]
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.meminfo
      - --collector.cpu
    volumes:
      - /:/host:ro
    ports:
      - "56192:9100"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: emb-cdc-prometheus
    networks: [emb-cdc-net]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - emb-prometheus-data:/prometheus
    ports:
      - "56090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: emb-cdc-grafana
    networks: [emb-cdc-net]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - emb-grafana-data:/var/lib/grafana
    ports:
      - "56300:3000"

volumes:
  emb-prometheus-data:
  emb-grafana-data:
