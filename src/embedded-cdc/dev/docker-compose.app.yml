# ─────────────────────────────────────────────────────────────────────────────
# cdc-service — Debezium Embedded Engine 을 내장한 Spring Boot 서비스
#
#   source-postgres (WAL) ──logical replication──▶ cdc-service ──JDBC──▶ target-postgres
#
# offset(어디까지 읽었는지)은 named volume 의 파일에 저장되므로
# 컨테이너를 재시작해도 멈춘 지점부터 이어서 읽는다.
# ─────────────────────────────────────────────────────────────────────────────
# 루트 docker-compose.yml 의 include 로만 쓴다 — 단독으로 -f 지정해 올리면 프로젝트가
# 따로 잡혀 같은 container_name/네트워크를 두고 충돌한다.
networks:
  emb-cdc-net:
    name: emb-cdc-net

services:
  cdc-service:
    # 두 DB 가 healthy 가 된 뒤에 올라온다. 원천이 아직 wal_level=logical 로 다시
    # 뜨기 전에 붙으면 복제 슬롯 생성이 실패한 채로 재시도 루프에 빠진다.
    # (루트 compose 는 include 한 서비스를 덮어쓸 수 없으므로 여기에 둔다)
    depends_on:
      source-postgres:
        condition: service_healthy
      target-postgres:
        condition: service_healthy
    build:
      context: ./cdc-service
    image: embedded-cdc/cdc-service:local
    container_name: emb-cdc-service
    networks: [emb-cdc-net]
    environment:
      SOURCE_DB_HOST: source-postgres
      SOURCE_DB_PORT: "5432"
      TARGET_DB_HOST: target-postgres
      TARGET_DB_PORT: "5432"
      # V1 — UPDATE 의 변경 필드를 cdc_change_audit 에 남길 테이블. 세 가지 형태:
      #   CDC_AUDIT_CHANGED_FIELDS=              끔
      #   CDC_AUDIT_CHANGED_FIELDS=car,computer  일부 (쉼표 구분)
      #   CDC_AUDIT_CHANGED_FIELDS=*             전체 (all 도 같다)
      # 이벤트당 INSERT 한 건이 더 붙어 1만 건 UPDATE 버스트에서 처리량이 3분의 1 줄고
      # 최대 지연이 목표 5초를 넘겼다(10.1초). PoC 에서는 감사 동작을 보여주기 위해
      # car 한 테이블에만 켠다. 성능 비교 측정처럼 조건을 맞춰야 할 때는 빈 값으로:
      #   CDC_AUDIT_CHANGED_FIELDS= docker compose up -d cdc-service
      # (`:-` 가 아니라 `-` 라 명시적으로 빈 값을 주면 그대로 빈 값이 된다)
      CDC_AUDIT_CHANGED_FIELDS: ${CDC_AUDIT_CHANGED_FIELDS-car}
    ports:
      - "56080:8080"
    volumes:
      - emb-cdc-offsets:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  emb-cdc-offsets:
