spring:
  application:
    name: cdc-service
  datasource: # target DB (JPA 로 UPSERT/DELETE)
    url: jdbc:postgresql://${TARGET_DB_HOST:localhost}:${TARGET_DB_PORT:56433}/${TARGET_DB_NAME:targetdb}
    username: ${TARGET_DB_USER:postgres}
    password: ${TARGET_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # 스키마는 init SQL 이 만든다. validate 는 기동 시점에 엔티티와 실제 테이블을 대조하므로
      # target 테이블이 지워지거나 컬럼이 바뀌면 조용히 도는 대신 기동이 실패한다.
      ddl-auto: validate
    open-in-view: false # 웹 요청이 없는 서비스다. 켜두면 커넥션을 불필요하게 오래 잡는다
    properties:
      hibernate:
        jdbc:
          batch_size: 50 # 지금은 이벤트당 한 문장이라 효과가 없다. 배치 적용을 넣을 때 살아난다
        order_inserts: true
        order_updates: true

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, metrics
  endpoint:
    health:
      show-details: always

cdc:
  source: # source DB (Debezium 이 logical replication 으로 직접 접속)
    # 커넥터의 정체성. 같은 DB 에 커넥터를 둘 이상 붙일 때(테이블별 샤딩 등)
    # name / topic-prefix / slot-name / publication-name / offset-file 다섯 개가
    # 인스턴스마다 전부 달라야 한다. 겹치면 슬롯을 다투거나 오프셋을 서로 덮어쓴다.
    name: ${CDC_NAME:embedded-cdc}
    topic-prefix: ${CDC_TOPIC_PREFIX:embedded}
    hostname: ${SOURCE_DB_HOST:localhost}
    port: ${SOURCE_DB_PORT:56432}
    user: ${SOURCE_DB_USER:cdc_user}
    password: ${SOURCE_DB_PASSWORD:cdc_pass}
    dbname: ${SOURCE_DB_NAME:sourcedb}
    slot-name: ${CDC_SLOT_NAME:embedded_cdc_slot}
    publication-name: ${CDC_PUBLICATION_NAME:embedded_cdc_pub}
    # cdc_heartbeat 가 여기 들어 있어야 한다. publication 에만 넣고 빼두면
    # heartbeat 쓰기가 슬롯만 밀고 우리 진행 지점(cdc_checkpoint)은 멈춰 있게 된다.
    # 그 간격을 다음 기동에서 SlotContinuityGuard 가 캡처 갭으로 읽어 기동을 거부한다
    # (유휴 36분 = 1.1MB 어긋남으로 실제 발생). 매핑된 핸들러가 없으므로 target 에는
    # 아무것도 쓰이지 않고, 배치의 최대 LSN 만 체크포인트로 남는다.
    table-include-list: ${CDC_TABLE_INCLUDE_LIST:public.car,public.computer,public.grade,public.member,public.cdc_heartbeat}
    snapshot-mode: ${CDC_SNAPSHOT_MODE:initial}
    offset-file: ${CDC_OFFSET_FILE:./data/offsets.dat}
    # 되받을 수 없는 구간을 발견하면 기동을 거부한다.
    # 조용히 어긋난 채로 도는 것보다 멈추고 재동기화를 요구하는 편이 낫다.
    fail-on-capture-gap: ${CDC_FAIL_ON_CAPTURE_GAP:true}
    # source DB 와 이 프로세스의 시계 차이를 재는 주기.
    # end-to-end 지연은 DB 시계와 앱 시계의 차이라 편차가 그대로 지연으로 보인다.
    # 편차를 같이 재두지 않으면 지연 수치를 믿어도 되는지 판정할 수 없다 (V1).
    clock-skew-probe-interval-ms: ${CDC_CLOCK_SKEW_INTERVAL_MS:30000}
    # 관심 테이블에 변경이 없을 때도 슬롯을 전진시킨다.
    # interval 만 켜면 전진이 0 bytes 다 — action-query 가 publication 에 든
    # 테이블에 쓰기를 만들어줘야 confirm 이 일어난다 (V6 측정: 33,440 bytes).
    heartbeat-interval-ms: ${CDC_HEARTBEAT_INTERVAL_MS:10000}
    # 한 행만 갱신한다. append 로 두면 heartbeat 가 테이블을 키운다.
    heartbeat-action-query: ${CDC_HEARTBEAT_QUERY:INSERT INTO cdc_heartbeat (pipeline, beat_at) VALUES ('embedded-cdc', now()) ON CONFLICT (pipeline) DO UPDATE SET beat_at = now()}

  apply: # 적용 실패를 다루는 정책
    # 배치 전체를 다시 시도하는 횟수. 소진하면 건 단위로 좁혀 범인만 격리한다.
    max-batch-retries: ${CDC_MAX_BATCH_RETRIES:3}
    # 첫 재시도 대기. 시도마다 두 배로 늘어난다 (200, 400, 800ms)
    retry-backoff-ms: ${CDC_RETRY_BACKOFF_MS:200}
    # 한 배치에서 이 비율을 넘게 격리되면 구조 문제로 보고 멈춘다.
    # 그러지 않으면 수신 테이블이 통째로 사라졌을 때 DLQ 가 전체 트래픽을 삼킨다.
    halt-on-dead-letter-ratio: ${CDC_HALT_DLQ_RATIO:0.5}
    # UPDATE 의 변경 필드를 cdc_change_audit 에 남길 테이블. 세 가지 형태를 받는다.
    #   비움            : 끔
    #   car,computer    : 일부 (쉼표 구분, public.car 처럼 스키마가 붙어도 됨)
    #   * 또는 all      : 전체 (publication 에 든 관심 테이블 전부)
    # 필드 단위 변경 식별은 이벤트에서는 이미 되지만(V1), 그걸 어디에도 남기지 않으면
    # "언제 무엇이 무엇으로 바뀌었나"를 사후에 물을 수 없다. 남길 곳은 지표가 아니라 표다 —
    # 변경 필드명을 Prometheus 레이블로 쓰면 시계열이 컬럼 조합 수만큼 생겨 터진다.
    #
    # 전역 on/off 가 아니라 목록인 이유는 비용 때문이다. 이벤트당 INSERT 한 건이 더 붙어
    # 1만 건 UPDATE 버스트에서 처리량이 2,467 -> 1,654 events/s 로 떨어졌고
    # 최대 지연이 5.9초 -> 10.1초로 목표(5초)를 넘겼다. 감사가 필요한 테이블에만 켤 것.
    audit-changed-fields: ${CDC_AUDIT_CHANGED_FIELDS:}

  dead-letter: # 격리된 이벤트 재처리
    # PENDING 은 자동으로 집지 않는다. 원인을 고친 뒤
    #   UPDATE cdc_dead_letter SET status = 'RETRY_REQUESTED' WHERE id = ...;
    # 로 표시한 건만 재처리된다.
    reprocess-enabled: ${CDC_DLQ_REPROCESS:true}
    reprocess-interval-ms: ${CDC_DLQ_INTERVAL_MS:30000}
    reprocess-batch-size: ${CDC_DLQ_BATCH_SIZE:50}

logging:
  level:
    dev.embeddedcdc: info
    io.debezium: info
