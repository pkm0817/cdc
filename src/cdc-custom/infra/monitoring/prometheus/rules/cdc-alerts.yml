# ─────────────────────────────────────────────────────────────────────────────
# 동기화 파이프라인 경보 규칙 (outbox 방식)
#
# CDC 두 스택(embedded-cdc, embedded-cdc-go)의 규칙과 이름·구조를 맞췄지만,
# 포착 방식이 달라 절반은 뜻이 다르다. 다른 지점만 적어 둔다.
#
#   - 복제 슬롯이 없다. 슬롯 lag / wal_status / 캡처 갭 경보가 통째로 빠진다.
#     그 자리를 대신하는 것이 outbox 적체(cdc_outbox_pending)와 최장 대기 시간이다.
#   - "되받을 수 없는 구간" 이라는 개념이 없다. outbox 줄은 우리가 지우기 전까지
#     남아 있으므로, 컨슈머가 오래 죽어도 유실이 아니라 적체가 된다.
#     대신 적체가 곧 원천 표의 비대이고, 그것이 이 방식의 기본 실패 모드다.
#   - 중간 상태가 남지 않는다. 같은 행이 100번 바뀌어도 반영은 한 번이므로
#     "이벤트 수 vs 행 수" 대사가 성립하지 않는다. 대사는 최종 상태(건수)로만 한다.
#
# 알림 전송 경로(Alertmanager)는 붙이지 않았다. Prometheus 의 Alerts 탭에서 본다.
# ─────────────────────────────────────────────────────────────────────────────
groups:
  - name: sync-pipeline
    interval: 15s
    rules:

      # ── 프로세스 ──────────────────────────────────────────────────────────
      - alert: SyncServiceDown
        expr: up{job="cdc-service"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "sync-service 스크랩 실패 — 프로세스 중단"
          description: "이 상태에서는 outbox 가 계속 쌓인다. 유실은 아니지만 원천 표가 비대해진다."

      - alert: SyncServiceRestartLoop
        expr: changes(process_start_time_seconds{job="cdc-service"}[15m]) > 3
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "sync-service 15분 내 4회 이상 재기동"
          description: "기동 직후 실패하는 상태다. 화면에는 '반영이 안 되네' 정도로만 보이므로 이 경보가 필요하다."

      # ── outbox 적체 — CDC 의 슬롯 지연에 해당한다 ─────────────────────────
      # 이 방식에서 컨슈머가 멈추면 WAL 이 아니라 outbox 표가 자란다.
      # 행당 약 30바이트라 CDC 쪽 WAL 압력보다 한참 느리게 자라지만, 상한이 없는 것은 같다.
      - alert: SyncOutboxBacklogWarning
        expr: cdc_outbox_pending > 100000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "outbox 미반영 {{ $value }}줄"
          description: "접기 전 줄 수다. 반영은 접힌 뒤라 이 수치가 곧 지연 건수는 아니다. 최장 대기 시간을 함께 볼 것."

      - alert: SyncOutboxBacklogCritical
        expr: cdc_outbox_pending > 1000000
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "outbox 미반영 100만 줄 초과 ({{ $value }})"
          description: "워커가 따라잡지 못하고 있다. 배치 크기·폴링 주기를 먼저 보고, 그래도 안 되면 원천 배치 쪽을 줄인다."

      # 적체 건수보다 이쪽이 먼저 신호가 된다 — 줄 수가 적어도 오래 묵으면 멈춘 것이다.
      - alert: SyncOutboxStalled
        expr: cdc_outbox_oldest_age_seconds > 300
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "outbox 최장 대기 {{ $value | humanizeDuration }}"
          description: "가장 오래된 줄이 5분 넘게 안 읽혔다. 워커가 살아 있는지(up)와 체크포인트 정체를 함께 볼 것."

      # 원천 표의 비대. outbox 는 반영 뒤 지워지므로 크기가 계속 자라면 지우지 못하고 있다는 뜻이다.
      - alert: SyncOutboxTableBloat
        expr: cdc_outbox_size_bytes > 1073741824
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "sync_outbox 표가 1GB 초과 ({{ $value | humanize1024 }}B)"
          description: "반영 후 삭제가 밀렸거나 VACUUM 이 못 따라가는 상태다. 원천 디스크에 직접 영향이 간다."

      # ── 진행 지점 ─────────────────────────────────────────────────────────
      # 변경이 없으면 자연히 커지므로 그 자체로는 이상이 아니다.
      # outbox 에 줄이 쌓이는데도 커지면 정체다 — 두 조건을 함께 건다.
      - alert: SyncCheckpointStalled
        expr: >
          max(cdc_checkpoint_stale_seconds) > 300
          and on() (max(cdc_outbox_pending) > 0)
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "읽을 줄이 있는데 체크포인트가 5분 넘게 전진하지 않음"
          description: "워커가 살아 있는데 반영이 멈춘 상태다. DLQ 와 앱 로그를 볼 것."

      # ── 정합성 ────────────────────────────────────────────────────────────
      - alert: SyncDeadLetterPending
        expr: cdc_dlq_total_pending > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "DLQ 에 미반영 {{ $value }}건"
          description: "유실은 아니지만 추적되는 미반영이다. 대사 판정식에서 빼고 본다."

      # 판정식: |source − target| − DLQ(PENDING) = 0
      # 반영 지연을 걸러내려 10분을 기다린다. 이 방식은 접기 때문에 반영이 몰려서 오므로
      # CDC 두 스택보다 순간 차이가 크게 벌어졌다 붙는다.
      - alert: SyncReconcileMismatch
        expr: >
          abs(sum by (table_name) (cdc_source_rows) - sum by (table_name) (cdc_target_rows))
          - (
              sum by (table_name) (cdc_dlq_rows{status="PENDING"})
              or sum by (table_name) (cdc_source_rows * 0)
            ) != 0
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "대사 불일치 — {{ $labels.table_name }} 차이 {{ $value }}건 (DLQ 로 설명 안 됨)"
          description: "건수가 같아도 값이 다를 수 있다. 이 방식은 최종 상태만 맞추므로 체크섬 대사를 함께 돌릴 것."

      - alert: SyncOrphanRows
        expr: cdc_orphan_rows > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "고아 참조 — {{ $labels.child_table }} → {{ $labels.parent_table }} {{ $value }}건"
          description: "접기 때문에 부모·자식의 반영 순서가 원천 커밋 순서와 달라질 수 있다. 이 방식에서 특히 볼 값이다."

      # ── 지연 ──────────────────────────────────────────────────────────────
      # cdc_end_to_end_lag_seconds 는 outbox 에 기록된 시각(DB 시계)과 반영 시각(앱 시계)의
      # 차다. 두 시계가 어긋나면 그 편차가 지연으로 둔갑한다. 지연이 폴링 주기에 지배된다고
      # 해서 이 문제가 없어지지는 않으므로, CDC 두 스택과 같은 게이트를 건다.
      #
      # and on() 은 레이블이 없는 편차 게이지를 표별 지연 시계열 전부에 맞물리기 위한 것이다.
      # on(table) 로 쓰면 짝이 없어 아무것도 안 남는다.
      - alert: SyncLatencyBudgetExceeded
        expr: >
          cdc_end_to_end_lag_seconds_max > 5
          and on() (abs(cdc_clock_skew_seconds) <= 0.5)
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "반영 지연이 5초 예산 초과 (table={{ $labels.table }})"
          description: "시계 편차는 이미 걸러진 상태다. 실제 지연이므로 폴링 주기와 배치 크기부터 볼 것."

      # 게이트만 걸어두면 시계가 틀어졌을 때 지연 경보가 조용히 사라져 "지연 없음" 으로 보인다.
      # 판정을 못 하는 상태 자체를 따로 알린다. CDC 두 스택의 CdcLatencyUnverifiable 과 같은 짝이다.
      - alert: SyncLatencyUnverifiable
        expr: >
          cdc_end_to_end_lag_seconds_max > 5
          and on() (abs(cdc_clock_skew_seconds) > 0.5)
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "지연 판정 불가 — 시계 편차가 허용치를 넘음 (table={{ $labels.table }})"
          description: "지연이 큰 것인지 시계가 틀린 것인지 구분할 수 없다. NTP 를 먼저 맞추고 다시 잰다."

      # 앱이 직접 재는 값이다 — SourceClockSkewProbe 가 source DB 의 clock_timestamp() 를
      # 왕복 보정해 자기 시계와 견준다. 지연 지표를 오염시키는 것이 정확히 이 한 쌍이므로
      # 아래 스크랩 기반 대체 판정보다 이쪽이 먼저다.
      - alert: SyncClockSkew
        expr: abs(cdc_clock_skew_seconds) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "source DB 와 sync-service 의 시계 편차가 0.5초 초과 ({{ $value }}s)"
          description: "목표 지연(5초)의 10% 를 넘었다. 이 구간에 측정한 지연값은 보고서에서 제외할 것."

      # 앱이 안 떠 있으면 위 지표가 아예 없다. DB 지표만으로 판정하는 경로를 남겨 둔다 — 지우지 말 것.
      - alert: SyncClockSkewByScrape
        expr: >
          abs(max(cdc_clock_epoch_seconds{job="source-db"}
                  - timestamp(cdc_clock_epoch_seconds{job="source-db"}))) > 0.5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "source DB 시계와 수집기 시계의 편차가 0.5초 초과"
          description: "앱 지표가 없을 때의 대체 판정이다. 앱이 살아 있다면 SyncClockSkew 를 먼저 볼 것."

      # ── 이 방식이 이득인가 ────────────────────────────────────────────────
      # 접기 비율이 1 에 가까우면 같은 행이 반복해서 바뀌지 않는 부하라는 뜻이고,
      # 그런 부하에서는 CDC 대비 이 방식의 이점이 없다. 장애가 아니라 판단 재료다.
      - alert: SyncFoldingIneffective
        expr: >
          increase(sync_outbox_entries_total[30m])
          / clamp_min(increase(sync_folded_rows_total[30m]), 1) < 1.1
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "접기 비율이 30분간 1.1 미만 — 접힌 것이 거의 없다"
          description: "서로 다른 행이 한 번씩 바뀌는 부하다. 이 방식의 이점(같은 행 반복 갱신을 한 번으로 접기)이 나오지 않는 구간이라는 신호."
