# source DB 전용 커스텀 쿼리 (cdc-custom)
# 메트릭 이름 = <최상위 키>_<컬럼명>  (예: cdc_source_rows{table_name="car"})
#
# CDC 판과 이름을 맞춘다(cdc_source_rows 등). 세 스택을 같은 대시보드·같은 쿼리로
# 비교하기 위해서다. 다만 중신은 다르다 — 여기에는 publication 도 슬롯도 없다.
#
# 대상 테이블은 카탈로그에서 읽는다. 업무 표만 세고 살림살이(sync_*)는 뺀다.
# 표가 늘어도 이 파일을 고칠 일이 없다.
cdc_source:
  query: |
    SELECT t.tablename AS table_name,
           (xpath('/row/c/text()',
                  query_to_xml(format('SELECT count(*) AS c FROM %I.%I', t.schemaname, t.tablename),
                               false, true, '')))[1]::text::float AS rows
    FROM pg_tables t
    WHERE t.schemaname = 'public'
      AND t.tablename NOT LIKE 'sync\_%'
  metrics:
    - table_name:
        usage: "LABEL"
        description: "table name (discovered from the catalog)"
    - rows:
        usage: "GAUGE"
        description: "exact row count in source table"

# ── outbox 적체 ──────────────────────────────────────────────────────────────
# CDC 의 cdc_slot_lag_bytes 에 해당하는 지표다. 반영이 멈추면 여기가 자란다.
#
#   pending    : 아직 반영되지 않은 줄 수
#   oldest_age : 가장 오래 기다린 줄의 나이(초). 지연을 소스 쪽에서 본 값이다.
#   size_bytes : outbox 표가 차지하는 디스크. 비우기가 도는지 확인하는 용도다.
#
# 슬롯과 달리 이 표는 우리가 지운다. 즉 적체가 커져도 원천 DB 가 죽지는 않고,
# 대신 이 표만 커진다 — 위험의 성격이 "디스크 고갈"에서 "표 비대"로 바뀐다.
cdc_outbox:
  query: |
    SELECT count(*)::float AS pending,
           COALESCE(EXTRACT(EPOCH FROM (now() - min(changed_at))), 0)::float AS oldest_age_seconds,
           pg_total_relation_size('sync_outbox')::float AS size_bytes
    FROM sync_outbox
  metrics:
    - pending:
        usage: "GAUGE"
        description: "outbox rows not yet applied"
    - oldest_age_seconds:
        usage: "GAUGE"
        description: "age of the oldest unapplied outbox row"
    - size_bytes:
        usage: "GAUGE"
        description: "disk size of the outbox table"

# ── WAL 사용량 ───────────────────────────────────────────────────────────────
# 이 방식은 WAL 을 읽지 않지만 WAL 은 여전히 쓰인다(모든 쓰기가 그렇다).
# 세 스택을 나란히 보면 REPLICA IDENTITY FULL 이 없는 쪽이 얼마나 적게 쓰는지가
# 이 그래프에서 그대로 드러난다 — 그 차이가 이 방식을 만든 이유다.
cdc_wal:
  query: |
    SELECT COALESCE(sum(size), 0)::float AS size_bytes,
           count(*)::float               AS files
    FROM pg_ls_waldir()
  metrics:
    - size_bytes:
        usage: "GAUGE"
        description: "total bytes held in pg_wal/"
    - files:
        usage: "GAUGE"
        description: "number of WAL segment files"

cdc_db:
  query: |
    SELECT pg_database_size(current_database())::float AS size_bytes,
           (SELECT count(*) FROM pg_stat_activity WHERE datname = current_database())::float AS connections
  metrics:
    - size_bytes:
        usage: "GAUGE"
        description: "database size on disk"
    - connections:
        usage: "GAUGE"
        description: "current backend connections to this database"

# ── WAL 생성량 카운터 ───────────────────────────────────────────────────────
# 이 방식에는 복제 슬롯이 없지만 WAL 은 그대로 쓰인다. 트리거가 outbox 에 INSERT 를
# 하나 더 만들기 때문에 "포착 비용" 이 원천 WAL 로도 나타난다.
# CDC 두 스택과 같은 축에 놓고 비교하려면 같은 지표가 필요하다.
cdc_wal_lsn:
  query: |
    SELECT pg_wal_lsn_diff(pg_current_wal_lsn(), '0/0'::pg_lsn)::float AS bytes_total
  metrics:
    - bytes_total:
        usage: "COUNTER"
        description: "current WAL LSN as a byte offset — rate() 로 WAL 증가율(B/s)"

# ── DB 시계 ─────────────────────────────────────────────────────────────────
# cdc_end_to_end_lag_seconds 는 outbox 에 기록된 시각(DB 시계)과 반영 시각(앱 시계)의
# 차다. 두 시계가 어긋나면 그 차이가 지연 수치에 통째로 섞인다.
#   cdc_clock_epoch_seconds - timestamp(cdc_clock_epoch_seconds)
# 로 "DB 시계 − 스크랩 시각" 을 얻는다. time() 을 쓰면 스크랩 간격이 편차로 잡힌다.
cdc_clock:
  query: |
    SELECT extract(epoch from clock_timestamp())::float AS epoch_seconds
  metrics:
    - epoch_seconds:
        usage: "GAUGE"
        description: "DB wall clock at scrape time (unix epoch seconds)"

# ── outbox 트리거 현황 ──────────────────────────────────────────────────────
# CDC 두 스택의 "REPLICA IDENTITY 가 FULL 인가" 에 해당하는 스키마 가드다.
# 이 방식의 포착은 전적으로 문장 단위 트리거에 달려 있다. 표를 새로 만들고 트리거를
# 빠뜨리거나, 누군가 DISABLE TRIGGER 를 하면 그 표의 변경은 흔적 없이 사라진다 —
# 슬롯 유실과 같은 급의 사고인데 DB 는 아무 것도 알려 주지 않는다.
# 그래서 표별로 트리거가 걸려 있고 켜져 있는지를 상시로 노출한다.
cdc_trigger:
  query: |
    SELECT c.relname AS table_name,
           t.tgname  AS trigger_name,
           (CASE WHEN t.tgenabled = 'D' THEN 0 ELSE 1 END)::float AS enabled
    FROM pg_trigger t
    JOIN pg_class c     ON c.oid = t.tgrelid
    JOIN pg_namespace n ON n.oid = c.relnamespace
    WHERE NOT t.tgisinternal
      AND n.nspname = 'public'
      AND t.tgname LIKE '%\_sync\_%'
  metrics:
    - table_name:
        usage: "LABEL"
        description: "table name"
    - trigger_name:
        usage: "LABEL"
        description: "outbox 트리거 이름 (<표>_sync_ins/upd/del)"
    - enabled:
        usage: "GAUGE"
        description: "1 이면 켜져 있다. 0 이면 그 연산의 변경이 outbox 에 안 들어간다"

# ── 운영 파라미터 현재값 ────────────────────────────────────────────────────
# 슬롯이 없으므로 max_slot_wal_keep_size 류는 이 방식에 직접 영향이 없다.
# CDC 두 스택과 같은 표에 나란히 놓고 "이 방식은 이 값들에 묶이지 않는다" 를
# 보이기 위해 같은 지표를 낸다.
cdc_guc:
  query: |
    SELECT name,
           COALESCE(unit, '') AS unit,
           setting::float     AS value
    FROM pg_settings
    WHERE name IN ('max_slot_wal_keep_size', 'wal_keep_size', 'max_wal_size',
                   'min_wal_size', 'checkpoint_timeout', 'max_replication_slots',
                   'max_wal_senders', 'autovacuum_vacuum_scale_factor')
  metrics:
    - name:
        usage: "LABEL"
        description: "GUC name"
    - unit:
        usage: "LABEL"
        description: "unit as reported by pg_settings"
    - value:
        usage: "GAUGE"
        description: "current setting"
