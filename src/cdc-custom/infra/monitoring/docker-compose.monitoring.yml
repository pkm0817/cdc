# ─────────────────────────────────────────────────────────────────────────────
# 모니터링 스택 — Prometheus + Grafana + postgres_exporter × 2 + 컨테이너 수집기 + node-exporter
#
#   source-exporter : source DB 의 테이블별 행 수 + slot 지연 + WAL 용량 + DB 크기
#   target-exporter : target DB 의 테이블별 행 수 + 소프트 삭제 행 수 + WAL 용량 + DB 크기
#   podman-exporter : 컨테이너별 CPU·메모리·블록 IO (앱 + source/target DB)
#                     — docker 데몬 환경에서는 --profile cadvisor 로 cAdvisor 를 대신 쓴다
#   node-exporter   : 도커 VM 의 디스크 여유 — WAL 이 슬롯에 붙잡혀 쌓일 때 고갈 경보용
#   prometheus      : 위 수집기들 + cdc-service(/metrics) 수집
#   grafana         : 정합성·처리량·지연 + 연산별(INSERT·UPDATE·DELETE) + 리소스 대시보드
#
# Java 판(embedded-cdc)과 같은 구성·같은 지표 이름을 쓴다. 두 스택을 나란히 띄워
# 대시보드를 나란히 놓고 비교하기 위해서다. 포트와 이름만 다르다.
#
# 접속: Grafana http://localhost:58300 (admin/admin, 익명 Viewer 허용)
#       Prometheus http://localhost:58090
# ─────────────────────────────────────────────────────────────────────────────
# 루트 docker-compose.yml 의 include 로만 쓴다 — 단독으로 -f 지정해 올리면 프로젝트가
# 따로 잡혀 같은 container_name/네트워크를 두고 충돌한다.
networks:
  cdc-custom-net:
    name: cdc-custom-net

services:
  source-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: cdc-custom-source-exporter
    networks: [cdc-custom-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@source-postgres:5432/sourcedb?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pgexporter/queries-source.yaml
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    volumes:
      - ./exporter:/etc/pgexporter:ro
    ports:
      - "58287:9187"

  target-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: cdc-custom-target-exporter
    networks: [cdc-custom-net]
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@target-postgres:5432/targetdb?sslmode=disable"
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/pgexporter/queries-target.yaml
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    volumes:
      - ./exporter:/etc/pgexporter:ro
    ports:
      - "58288:9187"

  # ── 리소스 계측 ────────────────────────────────────────────────────────────
  # 컨테이너별 CPU·메모리·블록 IO. 엔진에 따라 수집기가 다르다.
  #
  # podman(기본) : podman 소켓을 그대로 읽는다. rootless podman 에서는 cAdvisor 를
  #                쓸 수 없다 — /var/lib/docker 도 docker.sock 도 없고, cgroup 이
  #                user.slice 아래로 들어가 컨테이너 이름표가 붙지 않는다.
  # docker       : --profile cadvisor 로 아래 cadvisor 를 대신 띄운다.
  #
  # 대시보드는 두 수집기 중 무엇이 떠 있든 같은 이름으로 읽는다.
  # prometheus/rules.yml 이 양쪽을 cdc:container_* 로 정규화한다.
  podman-exporter:
    image: quay.io/navidys/prometheus-podman-exporter:v1.21.2
    container_name: cdc-custom-podman-exporter
    networks: [cdc-custom-net]
    # 소켓을 읽으려면 컨테이너 안에서 root 여야 한다(rootless 라도 VM 안 uid 0).
    user: root
    security_opt: ["label=disable"]
    environment:
      CONTAINER_HOST: unix:///run/podman/podman.sock
    command:
      # info 계열 라벨(name/image/pod)을 모든 지표에 붙여 준다 — name 으로 걸러야 하므로 필수.
      - --collector.enhance-metrics
    volumes:
      # rootless podman 의 소켓 위치. uid 가 1000 이 아니면 PODMAN_SOCK 로 덮어쓴다.
      - ${PODMAN_SOCK:-/run/user/1000/podman/podman.sock}:/run/podman/podman.sock:ro
    ports:
      - "58293:9882"

  # 도커 데몬이 있을 때만. 기본으로는 뜨지 않는다 (--profile cadvisor).
  # cAdvisor 는 데몬 전체를 보므로 두 스택(Java/Go)의 컨테이너가 모두 잡힌다.
  cadvisor:
    profiles: [cadvisor]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cdc-custom-cadvisor
    networks: [cdc-custom-net]
    privileged: true
    command:
      # 필요한 것만 켠다. 기본값은 수집 항목이 많아 스크랩이 무거워진다.
      - --housekeeping_interval=5s
      - --docker_only=true
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "58291:8080"

  # 도커 VM 의 파일시스템 여유. 이 방식에는 슬롯이 없어 WAL 이 붙잡히지 않지만,
  # outbox 를 비우지 못하면 그 표가 대신 자란다. 감시 대상이 바뀌었을 뿐 이유는 같다.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: cdc-custom-node-exporter
    networks: [cdc-custom-net]
    command:
      - --path.rootfs=/host
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.meminfo
      - --collector.cpu
    volumes:
      - /:/host:ro
    ports:
      - "58292:9100"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cdc-custom-prometheus
    networks: [cdc-custom-net]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - emb-go-prometheus-data:/prometheus
    ports:
      - "58290:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: cdc-custom-grafana
    networks: [cdc-custom-net]
    depends_on: [prometheus, renderer]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # 패널을 PNG 로 굽는 별도 컨테이너. 이게 없으면 /render 가 "No image renderer
      # available" 그림만 돌려주고, 경보 스크린샷과 PDF 내보내기도 동작하지 않는다.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      # 렌더러가 그림을 뜨려고 Grafana 를 다시 부를 때 쓰는 주소다.
      # localhost 로 두면 렌더러 컨테이너 자신을 가리켜 빈 화면이 나온다.
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - emb-go-grafana-data:/var/lib/grafana
    ports:
      - "58300:3000"

  # ── 이미지 렌더러 ───────────────────────────────────────────────────────────
  # Grafana 본체에는 렌더링 기능이 없다. 이 컨테이너가 헤드리스 Chromium 을 들고
  # 패널을 그려 PNG 로 돌려준다. 대시보드/패널 PNG·PDF 내보내기와 경보 스크린샷에 쓴다.
  # 포트를 밖으로 열지 않는다 — 열어두면 임의의 URL 을 렌더링시킬 수 있는 창구가 된다.
  renderer:
    image: grafana/grafana-image-renderer:3.11.6
    container_name: cdc-custom-renderer
    networks: [cdc-custom-net]
    environment:
      RENDERING_VERBOSE_LOGGING: "false"
      RENDERING_CLUSTERING_MAX_CONCURRENCY: "2"
      RENDERING_TIMEZONE: "Asia/Seoul"
    restart: unless-stopped

# 볼륨 이름의 emb-go- 접두사는 Go 판에서 옮겨 오며 남은 것이다. compose 가
# 프로젝트 이름으로 스코프하므로 다른 스택과 충돌하지는 않는다. 이름을 바꾸면
# 기존 Prometheus 시계열 이력이 끊기므로, 다음 -Wipe 때 함께 정리한다.
volumes:
  emb-go-prometheus-data:
  emb-go-grafana-data:
