# ─────────────────────────────────────────────────────────────────────────────
# Source PostgreSQL — 변경 원천 DB (cdc-custom)
#
# CDC 판과 달리 **논리 복제 설정이 하나도 없다.**
#   wal_level=logical      필요 없음 — WAL 을 읽지 않는다
#   max_replication_slots  필요 없음 — 슬롯을 만들지 않는다
#   wal_sender_timeout     필요 없음 — walsender 를 쓰지 않는다
#
# 그래서 CDC 판의 가장 큰 운영 위험 하나가 통째로 사라진다.
# "컨슈머가 죽어 있는 동안 슬롯이 WAL 을 붙잡아 원천 디스크가 고갈되는" 상황이
# 여기서는 생기지 않는다. 대신 다른 것을 떠안는다 — 업무 트랜잭션 안에서
# outbox 에 쓰는 비용, 그리고 outbox 를 비워주지 않으면 그 표가 커지는 문제다.
#
# 다른 두 스택(embedded-cdc, embedded-cdc-go)과 포트·컨테이너·네트워크를 전부
# 달리해 셋을 나란히 띄울 수 있다.
# ─────────────────────────────────────────────────────────────────────────────
# 루트 docker-compose.yml 의 include 로만 쓴다 — 단독으로 -f 지정해 올리면 프로젝트가
# 따로 잡혀 같은 container_name/네트워크를 두고 충돌한다.
networks:
  cdc-custom-net:
    name: cdc-custom-net

services:
  source-postgres:
    image: postgres:16
    container_name: cdc-custom-source-pg
    networks: [cdc-custom-net]
    environment:
      POSTGRES_DB: sourcedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command:
      - postgres
      # 대량 적재 시 체크포인트가 너무 잦아지지 않게만 올려 둔다.
      # 세 스택의 원천 조건을 맞추기 위한 값이지 이 방식에 필요한 설정은 아니다.
      - -c
      - max_wal_size=2GB
    ports:
      - "58432:5432"
    volumes:
      - cdc-custom-source-pgdata:/var/lib/postgresql/data
      - ./source/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sourcedb"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cdc-custom-source-pgdata:
