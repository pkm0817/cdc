# ─────────────────────────────────────────────────────────────────────────────
# Target PostgreSQL — 반영 대상 DB (cdc-custom)
#
# 특별한 설정이 없다. sync-service 가 일반 JDBC 로 UPSERT/DELETE 할 뿐이다.
# 체크포인트(sync_checkpoint)도 이 DB 에 있다 — 반영과 진행 지점이 한 트랜잭션에
# 묶여야 "반영했는데 진행 지점은 뒤에 남는" 틈이 생기지 않기 때문이다.
# ─────────────────────────────────────────────────────────────────────────────
# 루트 docker-compose.yml 의 include 로만 쓴다 — 단독으로 -f 지정해 올리면 프로젝트가
# 따로 잡혀 같은 container_name/네트워크를 두고 충돌한다.
networks:
  cdc-custom-net:
    name: cdc-custom-net

services:
  target-postgres:
    image: postgres:16
    container_name: cdc-custom-target-pg
    networks: [cdc-custom-net]
    environment:
      POSTGRES_DB: targetdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "58433:5432"
    volumes:
      - cdc-custom-target-pgdata:/var/lib/postgresql/data
      - ./target/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d targetdb"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cdc-custom-target-pgdata:
